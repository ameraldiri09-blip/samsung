T.ar.psb="نسخ الأمر";T.ar.stp="<li>افتح PowerShell (ابحث عنه في قائمة ابدأ)</li><li>الصق الأمر (Ctrl+V) ثم اضغط Enter</li><li>يتطلب winget وهو موجود في ويندوز 10/11</li>";T.ar.sec="إن ظهر تحذير أمان من المتصفح أو ويندوز عند تنزيل الملف، فهذا طبيعي لأي ملف تنفيذي محمّل من الإنترنت. تجنّبه بنسخ الأمر إلى PowerShell، أو بلصق السكربت في Notepad وحفظه بامتداد ‎.bat";
T.en.psb="Copy command";T.en.stp="<li>Open PowerShell (search for it in the Start menu)</li><li>Paste the command (Ctrl+V) and press Enter</li><li>Requires winget, included in Windows 10/11</li>";T.en.sec="A browser or Windows SmartScreen warning when downloading the file is normal for any executable downloaded from the internet. Avoid it by copying the command into PowerShell, or by pasting the script into Notepad and saving it as .bat";
T.tr.psb="Komutu kopyala";T.tr.stp="<li>PowerShell'i aç (Başlat menüsünde ara)</li><li>Komutu yapıştır (Ctrl+V) ve Enter'a bas</li><li>Windows 10/11'de bulunan winget gerekir</li>";T.tr.sec="Dosyayı indirirken tarayıcının veya Windows SmartScreen'in uyarı vermesi, internetten indirilen her çalıştırılabilir dosya için normaldir. Komutu PowerShell'e kopyalayarak ya da betiği Not Defteri'ne yapıştırıp .bat olarak kaydederek bundan kaçınabilirsin.";
T.fr.psb="Copier la commande";T.fr.stp="<li>Ouvrez PowerShell (cherchez-le dans le menu Démarrer)</li><li>Collez la commande (Ctrl+V) puis appuyez sur Entrée</li><li>Nécessite winget, inclus dans Windows 10/11</li>";T.fr.sec="Un avertissement du navigateur ou de Windows SmartScreen au téléchargement est normal pour tout fichier exécutable venant d'Internet. Évitez-le en copiant la commande dans PowerShell, ou en collant le script dans le Bloc-notes puis en l'enregistrant en .bat";
T.es.psb="Copiar comando";T.es.stp="<li>Abre PowerShell (búscalo en el menú Inicio)</li><li>Pega el comando (Ctrl+V) y pulsa Enter</li><li>Requiere winget, incluido en Windows 10/11</li>";T.es.sec="Un aviso del navegador o de Windows SmartScreen al descargar el archivo es normal en cualquier ejecutable descargado de Internet. Evítalo copiando el comando en PowerShell, o pegando el script en el Bloc de notas y guardándolo como .bat";
